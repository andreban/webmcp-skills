name: Skills Evaluation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      gemini_api_key:
        description: 'Gemini API Key (optional if repository secret is configured)'
        required: false
        type: string

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Check for Gemini API key
        id: check_key
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || inputs.gemini_api_key }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "has_key=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GEMINI_API_KEY is not set. Skipping promptfoo evaluations."
          else
            echo "has_key=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.check_key.outputs.has_key == 'true'

      - name: Set up Node.js
        if: steps.check_key.outputs.has_key == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        if: steps.check_key.outputs.has_key == 'true'
        run: npm ci

      - name: Run Promptfoo Skill Evals
        if: steps.check_key.outputs.has_key == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || inputs.gemini_api_key }}
        run: npm test
