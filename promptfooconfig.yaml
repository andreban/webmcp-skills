description: 'Evaluation suite for WebMCP Agent Skills'

prompts:
  - '{{ user_input }}'

providers:
  - id: 'google:gemini-3.5-flash-lite'
    config:
      apiKey: '{{ env.GEMINI_API_KEY }}'
      systemInstruction: 'file://skills/build-webmcp-tools/SKILL.md'

defaultTest:
  options:
    provider:
      id: 'google:gemini-3.5-flash-lite'
      config:
        apiKey: '{{ env.GEMINI_API_KEY }}'

evaluateOptions:
  maxConcurrency: 1
  delay: 1000

tests:
  # -------------------------------------------------------------
  # Stage 0: Dynamic Stage Assessment & Router
  # -------------------------------------------------------------
  - description: 'Stage 0 Router jumps directly to Stage 5 when tools exist'
    vars:
      user_input: 'I already have a schema.json defining tools for my pizza maker application. I want to generate evals.json for automated testing.'
    assert:
      - type: llm-rubric
        value: 'The agent must route directly to Stage 5 (Tool Specs & Evals Generation) or ask to view the existing schema.json, rather than forcing the user to redo Stage 1 (Goal Ideation) or Stage 2.'

  # -------------------------------------------------------------
  # Stage 2: Context & Diagnostic Pruning
  # -------------------------------------------------------------
  - description: 'Stage 2 aggressively prunes irrelevant hardware/diagnostic metrics'
    vars:
      user_input: 'The user wants to search for shoes on an e-commerce site. The application state is: current_url=/products, device_battery=87%, gpu_temp=68C, screen_dpi=2.0, cart_items=[]. Establish the starting state.'
    assert:
      - type: llm-rubric
        value: 'The agent must retain relevant application state (URL, cart) but explicitly prune or exclude device_battery, gpu_temp, and screen_dpi as irrelevant diagnostics.'

  # -------------------------------------------------------------
  # Stage 3: Turn-by-Turn Roleplay Structure & Pagination
  # -------------------------------------------------------------
  - description: 'Stage 3 includes 6 turn elements and paginates collections'
    vars:
      user_input: 'Role-play the first turn where a user asks for available hotel rooms in Paris next Friday.'
    assert:
      - type: llm-rubric
        value: 'The role-play turn must document user utterance, agent intent, tool invocation, structured JSON tool response with pagination (page_size, total_count), site UI reaction, and agent response.'

  # -------------------------------------------------------------
  # Stage 6: React Framework Pattern Compliance
  # -------------------------------------------------------------
  - description: 'Stage 6 React implementation uses use-webmcp-tool and no deprecated APIs'
    vars:
      user_input: 'Write the implementation code for search_hotels tool in a React component.'
    assert:
      - type: javascript
        value: '!output.includes("navigator.modelContext") && !output.includes("unregisterTool")'
      - type: javascript
        value: 'output.includes("useWebMCP") && output.includes("use-webmcp-tool")'
      - type: javascript
        value: 'output.includes("readOnlyHint: true")'

  # -------------------------------------------------------------
  # Stage 6: Angular Framework Pattern Compliance
  # -------------------------------------------------------------
  - description: 'Stage 6 Angular implementation uses provideExperimentalWebMcpTools'
    vars:
      user_input: 'Write the implementation code for search_hotels tool in an Angular application config.'
    assert:
      - type: javascript
        value: 'output.includes("provideExperimentalWebMcpTools")'
      - type: javascript
        value: '!output.includes("navigator.modelContext")'

  # -------------------------------------------------------------
  # Stage 1: User Goals Portfolio & Journey Prioritization
  # -------------------------------------------------------------
  - description: 'Stage 1 identifies and prioritizes candidate user journeys with boundaries'
    vars:
      user_input: 'I am building an airline ticketing website. Help me create my portfolio of user goals for WebMCP.'
    assert:
      - type: llm-rubric
        value: 'The agent must propose prioritized candidate user goals (such as flight search, seat selection, booking, or check-in) and define outcomes, context required, or boundaries for each goal.'

  # -------------------------------------------------------------
  # Stage 4: Human-in-the-Loop & High-Risk Boundaries
  # -------------------------------------------------------------
  - description: 'Stage 4 enforces human-in-the-loop hand-off on sensitive actions'
    vars:
      user_input: 'Design the roleplay turn where the user confirms payment for a $500 hotel booking.'
    assert:
      - type: llm-rubric
        value: 'The roleplay or tool design must explicitly require human confirmation on dedicated UI (e.g. requires_user_action status or confirmation hand-off) rather than autonomously executing payment without user action.'

  # -------------------------------------------------------------
  # Stage 5: Evals CLI & Format Specification
  # -------------------------------------------------------------
  - description: 'Stage 5 guides developer to run local evals with webmcp-evals CLI'
    vars:
      user_input: 'I have finalized our roleplay conversations. How do I test them automatically?'
    assert:
      - type: javascript
        value: 'output.includes("webmcp-evals") && output.includes("schema.json") && output.includes("evals.json")'

  # -------------------------------------------------------------
  # Stage 6: Vanilla JS with AbortController Lifecycle
  # -------------------------------------------------------------
  - description: 'Stage 6 Vanilla JS registers on document.modelContext with AbortSignal'
    vars:
      user_input: 'Write the implementation code for search_hotels tool in vanilla JavaScript.'
    assert:
      - type: javascript
        value: 'output.includes("document.modelContext") && output.includes("registerTool") && (output.includes("AbortController") || output.includes("signal"))'

  # -------------------------------------------------------------
  # Stage 6: Declarative HTML Forms Pattern
  # -------------------------------------------------------------
  - description: 'Stage 6 Declarative Forms uses standard form attributes and respondWith'
    vars:
      user_input: 'How do I expose a search tool using declarative HTML forms?'
    assert:
      - type: javascript
        value: 'output.includes("toolname") && output.includes("toolautosubmit") && output.includes("event.respondWith")'

  # -------------------------------------------------------------
  # Core Architectural Principle: In-tab client vs Backend stdio
  # -------------------------------------------------------------
  - description: 'Enforces in-tab client modelContext and rejects Node stdio transports'
    vars:
      user_input: 'How do I configure the stdio transport for WebMCP in my Express backend?'
    assert:
      - type: llm-rubric
        value: 'The agent must clarify that WebMCP runs client-side in the browser tab via document.modelContext and does not use stdio, SSE, or Node.js backend server transports.'

  # -------------------------------------------------------------
  # Core Principle: Character Budgets
  # -------------------------------------------------------------
  - description: 'Enforces character budgets on tool names, descriptions, and outputs'
    vars:
      user_input: 'What are the official Chrome character and token budget limits for WebMCP tools?'
    assert:
      - type: llm-rubric
        value: 'The agent must specify the character budgets: tool name <= 30 chars, tool description <= 500 chars, parameter description <= 150 chars, and tool output <= 1,500 chars (or ~1.5KB).'

  # -------------------------------------------------------------
  # Core Principle: Initiation vs Execution Naming
  # -------------------------------------------------------------
  - description: 'Distinguishes execution from initiation in tool naming'
    vars:
      user_input: 'How should I name a tool that navigates the user to a flight checkout form vs one that executes the booking immediately?'
    assert:
      - type: llm-rubric
        value: 'The agent must distinguish execution (e.g. book_flight or create_event) from initiation (e.g. initiate_booking or start_event_creation_process) rather than treating them identically.'

  # -------------------------------------------------------------
  # Annotations Matrix
  # -------------------------------------------------------------
  - description: 'Explains all three WebMCP annotations: readOnlyHint, consequentialHint, untrustedContentHint'
    vars:
      user_input: 'Which annotations can I attach to a WebMCP tool and what do they mean?'
    assert:
      - type: javascript
        value: 'output.includes("readOnlyHint") && output.includes("consequentialHint") && output.includes("untrustedContentHint")'

  # -------------------------------------------------------------
  # React Error Handling: Throw Error vs Return Failure Object
  # -------------------------------------------------------------
  - description: 'React tools throw Error instances to trigger isError rather than returning failure objects'
    vars:
      user_input: 'In useWebMCP, how should I handle a validation error when the user provides an invalid flight date?'
    assert:
      - type: llm-rubric
        value: 'The agent must instruct throwing an Error (e.g. throw new Error(...)) so the tool result receives isError: true, and advise against returning error objects as successful responses.'
